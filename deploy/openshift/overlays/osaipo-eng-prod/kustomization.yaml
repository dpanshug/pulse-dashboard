apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: osaipo-aspen--pulse-dashboard

resources:
- ../osaipo-eng

configMapGenerator:
- behavior: merge
  literals:
  - API_PUBLIC_URL=https://api-pulse-dashboard.apps.int.spoke.prod.us-east-1.aws.paas.redhat.com
  - AUTH_EMAIL_DOMAIN=cluster.local
  name: team-tracker-config

patches:
- path: route-patch.yaml
- path: api-route-patch.yaml
- path: storage-patch.yaml

images:
- name: quay.io/osaipo-data/osaipo-pulse-backend
  newName: image-registry.openshift-image-registry.svc:5000/osaipo-aspen--pulse-dashboard/osaipo-pulse-backend
  newTag: pr15-9f42a42a
- name: quay.io/osaipo-data/osaipo-pulse-frontend
  newName: image-registry.openshift-image-registry.svc:5000/osaipo-aspen--pulse-dashboard/osaipo-pulse-frontend
  newTag: pr15-9f42a42a
